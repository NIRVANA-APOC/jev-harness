[workspace]
members = ["crates/*"]
resolver = "2"

# 版本只写当前 crates.io 稳定版的 major.minor，patch 由 Cargo.lock 锁定（见 docs/roadmap-1.0.md §2）。
[workspace.dependencies]
# workspace 内部 crate：一律走 path 引用，各 crate 用 `dep = { workspace = true }` 取用（同版本策略）。
jh-core = { path = "crates/jh-core" }
jh-jev = { path = "crates/jh-jev" }
jh-openai = { path = "crates/jh-openai" }
jh-tui = { path = "crates/jh-tui" }
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "io-util",
    "sync",
    "fs",
    "process",
] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "http2",
    "charset",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
textwrap = "0.16"
futures = "0.3"
bytes = "1.12"
dotenvy = "0.15"
toml = "1.1"
